name: OpencodeWidgetApp
options:
  bundleIdPrefix: com.opencode.widget
  deploymentTarget:
    macOS: "14.0"

targets:
  OpencodeWidgetApp:
    type: application
    platform: macOS
    sources:
      - Sources/OpencodeWidgetApp
      - Sources/OpencodeWidgetShared
      - Sources/OpencodeWidgetLedger
      - path: OpencodeWidgetApp/Resources
        type: folder
      - path: OpencodeWidgetApp/AppIcon.icns
        buildPhase: resources
    dependencies: []
    info:
      path: OpencodeWidgetApp/Info.plist
      properties:
        CFBundleIconFile: AppIcon
        CFBundleDisplayName: Frontier Model Token Dashboard
        CFBundleName: Frontier Model Token Dashboard
        LSUIElement: true
        CFBundleShortVersionString: "1.5.3"
        CFBundleVersion: "9"
    entitlements:
      path: OpencodeWidgetApp/Entitlements.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.opencode.widget.app
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "1.5.3"
      CURRENT_PROJECT_VERSION: "9"
